<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주님과 네컷 Pro - Reformist Tradition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
            color: #1e293b;
        }

        /* 인화지 스트립 스타일 */
        .photo-strip {
            width: 320px;
            background: white;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative;
            border: 1px solid #e2e8f0;
        }

        /* 카메라 컨테이너 - 4:3 비율 유지 */
        .camera-container {
            position: relative;
            width: 100%;
            padding-bottom: 75%; /* 4:3 Ratio */
            background: #0f172a;
            border-radius: 1.5rem;
            overflow: hidden;
            border: 6px solid white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 미리보기 왜곡 방지 */
            object-position: center 35%; /* 스마트폰 세로 모드 대응: 얼굴 위주로 살짝 올림 */
            transform: scaleX(-1); /* 좌우 반전(거울 모드) */
        }

        /* 가이드라인 레이어 */
        .guide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            pointer-events: none;
            z-index: 10;
        }

        /* 예수님 아이콘 레이어 */
        .jesus-sticker {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 20;
            animation: gentle-bounce 2.5s infinite ease-in-out;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.03); }
        }

        /* 촬영 플래시 */
        .camera-flash {
            animation: flash-effect 0.6s ease-out forwards;
        }

        @keyframes flash-effect {
            0% { background: white; opacity: 1; }
            100% { background: transparent; opacity: 0; }
        }

        /* 필터 정의 */
        .f-none { filter: none; }
        .f-grayscale { filter: grayscale(100%); }
        .f-warm { filter: sepia(0.3) saturate(1.3) brightness(1.05); }
        .f-vintage { filter: contrast(0.9) sepia(0.5) brightness(1.1); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- 플래시 효과 -->
    <div id="flash-layer" class="fixed inset-0 z-50 pointer-events-none opacity-0"></div>

    <div class="max-w-6xl w-full flex flex-col lg:flex-row gap-12 items-start justify-center">
        
        <!-- 왼쪽: 촬영 통제실 -->
        <div class="w-full lg:w-[580px] space-y-8">
            <header>
                <div class="inline-flex items-center gap-2 bg-blue-600 text-white text-[10px] font-black px-3 py-1 rounded-full mb-4 uppercase tracking-widest shadow-md shadow-blue-200">
                    <i data-lucide="shield-check" class="w-3 h-3"></i> 
                    Reformist Tradition
                </div>
                <h1 class="text-5xl font-black text-slate-900 tracking-tight leading-none mb-3">주님과 네컷</h1>
                <p class="text-slate-500 font-medium italic">"주 안에서 항상 기뻐하라..." (빌립보서 4:4)</p>
            </header>

            <!-- 실시간 카메라 미리보기 -->
            <div class="camera-container">
                <video id="webcam" autoplay playsinline class="f-none"></video>
                <div class="guide-overlay"></div>
                
                <!-- 카운트다운 레이블 -->
                <div id="timer-display" class="absolute inset-0 flex items-center justify-center text-white text-[10rem] font-black hidden select-none z-30 drop-shadow-2xl">
                    3
                </div>

                <div id="loading-hint" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-900 z-20">
                    <i data-lucide="loader-2" class="w-10 h-10 mb-3 animate-spin"></i>
                    <p class="text-sm font-bold tracking-widest uppercase">Initializing Camera</p>
                </div>
            </div>

            <!-- 컨트롤 패널 -->
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- 효과 선택 -->
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                            <i data-lucide="wand-2" class="w-3 h-3 text-blue-500"></i> Filters
                        </label>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="applyFilter('none')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold hover:bg-blue-600 hover:text-white transition-all">Original</button>
                            <button onclick="applyFilter('grayscale')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold hover:bg-blue-600 hover:text-white transition-all">B&W</button>
                            <button onclick="applyFilter('warm')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold hover:bg-blue-600 hover:text-white transition-all">Warm</button>
                            <button onclick="applyFilter('vintage')" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold hover:bg-blue-600 hover:text-white transition-all">Vintage</button>
                        </div>
                    </div>

                    <!-- 프레임 색상 -->
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                            <i data-lucide="palette" class="w-3 h-3 text-blue-500"></i> Frames
                        </label>
                        <div class="flex gap-3">
                            <button onclick="updateFrame('#ffffff')" class="w-10 h-10 rounded-2xl border-4 border-slate-50 bg-white shadow-sm hover:scale-110 transition-transform"></button>
                            <button onclick="updateFrame('#1e293b')" class="w-10 h-10 rounded-2xl border-4 border-slate-50 bg-slate-800 shadow-sm hover:scale-110 transition-transform"></button>
                            <button onclick="updateFrame('#fee2e2')" class="w-10 h-10 rounded-2xl border-4 border-slate-50 bg-rose-50 shadow-sm hover:scale-110 transition-transform"></button>
                            <button onclick="updateFrame('#f0f9ff')" class="w-10 h-10 rounded-2xl border-4 border-slate-50 bg-sky-50 shadow-sm hover:scale-110 transition-transform"></button>
                        </div>
                    </div>
                </div>

                <!-- 촬영 버튼 -->
                <button id="capture-btn" onclick="runBoothSequence()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-6 rounded-2xl shadow-xl shadow-blue-200 transition-all transform active:scale-[0.98] flex items-center justify-center gap-4 text-2xl">
                    <i data-lucide="camera" class="w-8 h-8"></i>
                    네 컷 촬영 시작!
                </button>
            </div>
        </div>

        <!-- 오른쪽: 결과물 인화지 영역 -->
        <div class="w-full lg:w-auto flex flex-col items-center">
            <div id="print-area" class="photo-strip rounded-sm transition-all duration-500">
                <div id="output-grid" class="space-y-3">
                    <!-- 기본 대기 칸 -->
                    <div class="aspect-[4/3] bg-slate-50 rounded-sm flex items-center justify-center border border-slate-100 opacity-50"><i data-lucide="image" class="w-10 h-10 text-slate-200"></i></div>
                    <div class="aspect-[4/3] bg-slate-50 rounded-sm flex items-center justify-center border border-slate-100 opacity-50"><i data-lucide="image" class="w-10 h-10 text-slate-200"></i></div>
                    <div class="aspect-[4/3] bg-slate-50 rounded-sm flex items-center justify-center border border-slate-100 opacity-50"><i data-lucide="image" class="w-10 h-10 text-slate-200"></i></div>
                    <div class="aspect-[4/3] bg-slate-50 rounded-sm flex items-center justify-center border border-slate-100 opacity-50"><i data-lucide="image" class="w-10 h-10 text-slate-200"></i></div>
                </div>
                <!-- 하단 브랜딩 -->
                <div class="mt-8 text-center pt-5 border-t-2 border-dashed border-slate-100 pb-2">
                    <p id="brand-title" class="text-slate-400 font-black text-2xl tracking-[0.25em] italic mb-1 uppercase">주님과 네컷</p>
                    <p class="text-[8px] text-slate-300 font-bold tracking-[0.4em] uppercase">Sola Gratia • Soli Deo Gloria</p>
                </div>
            </div>

            <div class="mt-8 w-full md:w-80 flex flex-col gap-3">
                <button id="save-btn" onclick="saveToDevice()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl opacity-50 cursor-not-allowed transition-all flex items-center justify-center gap-3 shadow-xl" disabled>
                    <i data-lucide="download" class="w-5 h-5"></i>
                    사진 저장하기
                </button>
                <button onclick="window.location.reload()" class="text-slate-400 text-[10px] font-black uppercase tracking-widest hover:text-blue-600 py-2">New Session</button>
            </div>
        </div>
    </div>

    <!-- 숨겨진 렌더링용 캔버스 -->
    <canvas id="processing-canvas" style="display:none;"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const videoElement = document.getElementById('webcam');
        const timerLabel = document.getElementById('timer-display');
        const startBtn = document.getElementById('capture-btn');
        const saveBtn = document.getElementById('save-btn');
        const grid = document.getElementById('output-grid');
        const strip = document.getElementById('print-area');
        const flashOverlay = document.getElementById('flash-layer');
        
        let activeFilter = 'none';
        let isRunning = false;

        /** [중요] 목사님께서 준비하신 이미지 파일명입니다. 동일 폴더에 있어야 합니다. **/
        const ICON_FILENAME = 'jicon.png'; 

        lucide.createIcons();

        // 카메라 권한 획득 및 초기화
        async function bootCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 } 
                    } 
                });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    document.getElementById('loading-hint').classList.add('hidden');
                };
            } catch (err) {
                console.error("Camera access denied:", err);
                alert("카메라를 사용할 수 없습니다. 브라우저 설정에서 권한을 허용해 주세요.");
            }
        }

        function applyFilter(name) {
            activeFilter = name;
            videoElement.className = `f-${name}`;
        }

        function updateFrame(bgColor) {
            strip.style.backgroundColor = bgColor;
            const title = document.getElementById('brand-title');
            const isDark = (bgColor === '#1e293b');
            title.style.color = isDark ? '#ffffff' : '#94a3b8';
        }

        async function runBoothSequence() {
            if (isRunning) return;
            isRunning = true;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50');
            grid.innerHTML = ''; // 초기화

            for (let i = 0; i < 4; i++) {
                await startCountdown(3);
                await snapPhoto();
                await waitFor(700); // 촬영 후 잠시 대기
            }

            isRunning = false;
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50');
            saveBtn.disabled = false;
            saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function startCountdown(sec) {
            return new Promise((resolve) => {
                let count = sec;
                timerLabel.classList.remove('hidden');
                timerLabel.innerText = count;
                const clock = setInterval(() => {
                    count--;
                    if (count <= 0) {
                        clearInterval(clock);
                        timerLabel.classList.add('hidden');
                        resolve();
                    } else {
                        timerLabel.innerText = count;
                    }
                }, 1000);
            });
        }

        function snapPhoto() {
            return new Promise((resolve) => {
                const canvas = document.getElementById('processing-canvas');
                const ctx = canvas.getContext('2d');
                
                // 고해상도 4:3 비율 설정 (1200x900)
                const outW = 1200;
                const outH = 900;
                canvas.width = outW;
                canvas.height = outH;

                const vw = videoElement.videoWidth;
                const vh = videoElement.videoHeight;

                // [중앙 크롭 알고리즘] 어떤 비율의 카메라도 4:3 비율로 인물 왜곡 없이 잘라냄
                let sw, sh, sx, sy;
                const vAspect = vw / vh;
                const targetAspect = outW / outH;

                if (vAspect > targetAspect) {
                    // 가로가 넓은 소스 (예: PC 캠) - 좌우를 자름
                    sh = vh;
                    sw = vh * targetAspect;
                    sx = (vw - sw) / 2;
                    sy = 0;
                } else {
                    // 세로가 긴 소스 (예: 스마트폰 세로 모드) - 상하를 자름
                    sw = vw;
                    sh = vw / targetAspect;
                    sx = 0;
                    // 목사님! 여기 수정을 했습니다.
                    // 원래 (vh - sh) / 2 였던 것을 상단 위주(25%)로 크롭하도록 조정하여 얼굴이 나오게 했습니다.
                    sy = (vh - sh) * 0.25; 
                }

                ctx.save();
                // 촬영본은 좌우 반전을 풀어 실제 방향으로 저장
                ctx.translate(outW, 0);
                ctx.scale(-1, 1);
                
                // 필터 적용
                if (activeFilter === 'grayscale') ctx.filter = 'grayscale(100%)';
                if (activeFilter === 'warm') ctx.filter = 'sepia(0.3) saturate(1.3) brightness(1.05)';
                if (activeFilter === 'vintage') ctx.filter = 'contrast(0.9) sepia(0.5) brightness(1.1)';

                // 최종 렌더링
                ctx.drawImage(videoElement, sx, sy, sw, sh, 0, 0, outW, outH);
                ctx.restore();

                const imgData = canvas.toDataURL('image/png');
                addToGrid(imgData);
                
                // 시각적 플래시
                flashOverlay.classList.add('camera-flash', 'bg-white', 'opacity-100');
                setTimeout(() => {
                    flashOverlay.classList.remove('camera-flash', 'bg-white', 'opacity-100');
                }, 600);

                resolve();
            });
        }

        function addToGrid(url) {
            const wrapper = document.createElement('div');
            wrapper.className = "relative aspect-[4/3] bg-slate-200 rounded-sm overflow-hidden shadow-inner border border-slate-100/30";
            
            const mainImg = document.createElement('img');
            mainImg.src = url;
            mainImg.className = "w-full h-full object-cover";
            
            // 예수님 캐릭터 레이어
            const sticker = document.createElement('div');
            sticker.className = "jesus-sticker";
            sticker.innerHTML = `<img src="${ICON_FILENAME}" class="w-full h-full object-contain" onerror="this.style.display='none';">`;

            wrapper.appendChild(mainImg);
            wrapper.appendChild(sticker);
            grid.appendChild(wrapper);
        }

        function saveToDevice() {
            html2canvas(strip, {
                scale: 4, // 초고화질 인쇄 대응
                useCORS: true,
                allowTaint: true,
                backgroundColor: null
            }).then(canv => {
                const a = document.createElement('a');
                a.download = `주님과네컷_${new Date().getTime()}.png`;
                a.href = canv.toDataURL('image/png');
                a.click();
            });
        }

        function waitFor(ms) { return new Promise(r => setTimeout(r, ms)); }

        window.onload = bootCamera;
    </script>
</body>
</html>

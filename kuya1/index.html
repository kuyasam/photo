<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소요리문답 네컷 - GM 청소년</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f4f8;
        }

        /* 프리미엄 블루 테마 프레임 */
        .photo-strip {
            width: 320px;
            background-color: #1e3a8a; /* 딥 블루 */
            padding: 18px;
            box-shadow: 0 25px 50px -12px rgba(30, 58, 138, 0.5);
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-radius: 2px;
            position: relative;
        }

        .frame-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: #0f172a;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* [수정] 왼쪽 상단 주제 아이콘 (1.png ~ 4.png) */
        .theme-icon {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 55px; /* 아이콘 크기 조절 */
            height: auto;
            z-index: 25;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            pointer-events: none;
        }

        /* [기존 유지] 오른쪽 하단 예수님 아이콘 (jicon.png) */
        .frame-jesus-icon {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 50px;
            height: auto;
            z-index: 20;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            pointer-events: none;
        }

        .captured-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .strip-footer {
            text-align: center;
            margin-top: 10px;
            padding-bottom: 8px;
            color: white;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 3 / 2;
            background-color: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 10px solid white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .timer-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 7rem;
            color: white;
            font-weight: 900;
            text-shadow: 0 0 40px rgba(0,0,0,0.6);
            display: none;
            z-index: 100;
        }

        /* 필터 효과 클래스 */
        .preview-filter-none { filter: none; }
        .preview-filter-grayscale { filter: grayscale(1); }
        .preview-filter-sepia { filter: sepia(0.6) contrast(1.1); }
        .preview-filter-warm { filter: sepia(0.2) brightness(1.1) saturate(1.3); }
        .preview-filter-bright { filter: brightness(1.15) contrast(1.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-16 px-4">

    <!-- Header -->
    <div class="text-center mb-12 max-w-3xl">
        <h1 class="text-5xl font-black text-blue-900 mb-6 tracking-tight text-center">소요리문답 네컷</h1>
        <div class="bg-blue-50 border-l-4 border-blue-600 p-4 rounded-r-lg shadow-sm">
            <p class="text-lg text-blue-800 font-bold italic text-center">
                "사람의 제일 되는 목적은 하나님을 영화롭게 하는 것과<br>영원토록 그를 즐거워하는 것입니다."
            </p>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-16 items-start justify-center w-full max-w-6xl">
        
        <!-- Left Side: Camera & Controls -->
        <div class="flex-1 flex flex-col items-center gap-8 w-full">
            <div class="flex flex-wrap justify-center gap-3">
                <button onclick="setFilter('none')" class="bg-white border-2 border-blue-200 px-5 py-2 rounded-xl text-sm font-black text-blue-900 hover:border-blue-600 transition-all shadow-sm">기본</button>
                <button onclick="setFilter('grayscale')" class="bg-white border-2 border-blue-200 px-5 py-2 rounded-xl text-sm font-black text-blue-900 hover:border-blue-600 transition-all shadow-sm">흑백감성</button>
                <button onclick="setFilter('sepia')" class="bg-white border-2 border-blue-200 px-5 py-2 rounded-xl text-sm font-black text-blue-900 hover:border-blue-600 transition-all shadow-sm">빈티지</button>
                <button onclick="setFilter('warm')" class="bg-white border-2 border-blue-200 px-5 py-2 rounded-xl text-sm font-black text-blue-900 hover:border-blue-600 transition-all shadow-sm">따뜻함</button>
                <button onclick="setFilter('bright')" class="bg-white border-2 border-blue-200 px-5 py-2 rounded-xl text-sm font-black text-blue-900 hover:border-blue-600 transition-all shadow-sm">뽀샤시</button>
            </div>

            <div class="camera-container">
                <video id="webcam" autoplay playsinline class="preview-filter-none"></video>
                <div id="timer" class="timer-overlay">3</div>
                <canvas id="tempCanvas" class="hidden"></canvas>
            </div>
            
            <div class="flex flex-col items-center gap-5">
                <div class="flex gap-4">
                    <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-12 py-5 rounded-3xl font-black text-2xl transition-all shadow-2xl hover:scale-105 flex items-center gap-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M208,56H180.28L166.65,35.56A15.94,15.94,0,0,0,153.28,28H102.72a15.94,15.94,0,0,0-13.37,7.56L75.72,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,44h55.44l13.62,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"></path></svg>
                        촬영 시작
                    </button>
                    <button id="resetBtn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-8 py-5 rounded-3xl font-bold transition-all">초기화</button>
                </div>
                <p id="statusMsg" class="text-blue-600 font-black h-8 text-xl"></p>
            </div>
        </div>

        <!-- Right Side: The Strip -->
        <div class="flex flex-col items-center">
            <div id="captureArea" class="photo-strip">
                <!-- Frame 1 -->
                <div class="frame-container">
                    <img src="1.png" class="theme-icon" onerror="this.style.display='none'">
                    <img id="img0" class="captured-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    <img src="jicon.png" class="frame-jesus-icon" onerror="this.style.display='none'">
                </div>
                <!-- Frame 2 -->
                <div class="frame-container">
                    <img src="2.png" class="theme-icon" onerror="this.style.display='none'">
                    <img id="img1" class="captured-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    <img src="jicon.png" class="frame-jesus-icon" onerror="this.style.display='none'">
                </div>
                <!-- Frame 3 -->
                <div class="frame-container">
                    <img src="3.png" class="theme-icon" onerror="this.style.display='none'">
                    <img id="img2" class="captured-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    <img src="jicon.png" class="frame-jesus-icon" onerror="this.style.display='none'">
                </div>
                <!-- Frame 4 -->
                <div class="frame-container">
                    <img src="4.png" class="theme-icon" onerror="this.style.display='none'">
                    <img id="img3" class="captured-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
                    <img src="jicon.png" class="frame-jesus-icon" onerror="this.style.display='none'">
                </div>

                <div class="strip-footer">
                    <h2 class="text-2xl font-black tracking-tight leading-none mb-1 text-center">소요리문답 네컷</h2>
                    <p class="text-[10px] text-blue-200 font-bold uppercase tracking-[0.25em] text-center">GM 청소년 소요리문답 스쿨</p>
                </div>
            </div>
            
            <button id="downloadBtn" class="mt-8 bg-blue-900 text-white hover:bg-blue-800 transition-all px-10 py-4 rounded-full flex items-center gap-2 text-base font-bold shadow-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                네컷 이미지 저장하기
            </button>
        </div>
    </div>

    <div id="messageBox" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-blue-900 text-white px-10 py-5 rounded-full shadow-2xl opacity-0 transition-all duration-500 pointer-events-none z-[200] font-black text-lg">메시지</div>

    <script>
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const timerOverlay = document.getElementById('timer');
        const statusMsg = document.getElementById('statusMsg');
        const tempCanvas = document.getElementById('tempCanvas');
        const messageBox = document.getElementById('messageBox');
        const captureArea = document.getElementById('captureArea');
        const downloadBtn = document.getElementById('downloadBtn');
        
        let stream = null;
        let captureCount = 0;
        let currentFilter = 'none';

        function setFilter(filterName) {
            currentFilter = filterName;
            video.className = `preview-filter-${filterName}`;
            showToast(`필터 적용: ${filterName}`);
        }

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 1280, height: 720, facingMode: "user" } 
                });
                video.srcObject = stream;
            } catch (err) {
                statusMsg.innerText = "카메라를 시작할 수 없습니다.";
            }
        }

        window.onload = initCamera;

        function showToast(msg) {
            messageBox.innerText = msg;
            messageBox.style.opacity = '1';
            setTimeout(() => { messageBox.style.opacity = '0'; }, 2500);
        }

        async function takePhoto(index) {
            return new Promise((resolve) => {
                let countdown = 3;
                timerOverlay.style.display = 'block';
                timerOverlay.innerText = countdown;

                const timerId = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        timerOverlay.innerText = countdown;
                    } else {
                        clearInterval(timerId);
                        timerOverlay.style.display = 'none';
                        
                        const context = tempCanvas.getContext('2d');
                        tempCanvas.width = video.videoWidth;
                        tempCanvas.height = video.videoHeight;
                        
                        if (currentFilter === 'grayscale') context.filter = 'grayscale(1)';
                        else if (currentFilter === 'sepia') context.filter = 'sepia(0.6) contrast(1.1)';
                        else if (currentFilter === 'warm') context.filter = 'sepia(0.2) brightness(1.1) saturate(1.3)';
                        else if (currentFilter === 'bright') context.filter = 'brightness(1.15) contrast(1.1)';
                        else context.filter = 'none';

                        context.translate(tempCanvas.width, 0);
                        context.scale(-1, 1);
                        context.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                        
                        const dataUrl = tempCanvas.toDataURL('image/png');
                        document.getElementById(`img${index}`).src = dataUrl;
                        resolve();
                    }
                }, 1000);
            });
        }

        startBtn.addEventListener('click', async () => {
            if (captureCount > 0) {
                if(!confirm("새로 촬영하시겠습니까?")) return;
                resetPhotos();
            }
            startBtn.disabled = true;
            for (let i = 0; i < 4; i++) {
                statusMsg.innerText = `${i + 1}/4 촬영 중...`;
                await takePhoto(i);
                captureCount++;
            }
            statusMsg.innerText = "촬영 완료!";
            startBtn.disabled = false;
            showToast("촬영이 완료되었습니다!");
        });

        function resetPhotos() {
            captureCount = 0;
            for (let i = 0; i < 4; i++) {
                document.getElementById(`img${i}`).src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
            }
            statusMsg.innerText = "";
        }

        resetBtn.addEventListener('click', resetPhotos);

        downloadBtn.addEventListener('click', () => {
            if (captureCount < 4) {
                showToast("사진 4장을 모두 촬영해주세요.");
                return;
            }
            showToast("이미지 저장 중...");
            
            html2canvas(captureArea, {
                useCORS: true,
                scale: 3, 
                backgroundColor: "#1e3a8a",
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `ShorterCatechism_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast("저장되었습니다!");
            });
        });
    </script>
</body>
</html>
